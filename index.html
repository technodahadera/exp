<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08080d">
  <meta name="description" content="סרט פתיחה – טכנודע">
  <title>סרט פתיחה | טכנודע</title>
  <style>
    :root { color-scheme: dark; --accent:#c56ee1; }
    * { box-sizing: border-box; }
    html, body { margin:0; min-height:100%; width:100%; }
    body { font-family:Arial, sans-serif; background:#08080d; color:#fff; }
    main { min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; padding:clamp(8px,2.5vw,28px); }
    header { width:min(100%,1100px); display:flex; align-items:center; justify-content:space-between; gap:16px; }
    h1 { margin:0; font-size:clamp(18px,2.2vw,28px); font-weight:700; }
    .video-shell { width:min(100%,1100px); position:relative; background:#000; aspect-ratio:16/9; border-radius:16px; overflow:hidden; box-shadow:0 14px 56px #0008; }
    video { display:block; width:100%; height:100%; object-fit:contain; background:#000; }
    .actions { display:flex; gap:10px; align-items:center; }
    button { font:inherit; background:#25212e; border:1px solid #514359; color:white; border-radius:10px; padding:9px 14px; cursor:pointer; white-space:nowrap; }
    button:hover,button:focus-visible { background:#43354f; outline:2px solid var(--accent); outline-offset:2px; }
    #soundButton { background:#71378a; border-color:#9650b0; }
    .hint { margin:0; color:#c5bcc9; font-size:13px; text-align:center; }
    .error { display:none; position:absolute; inset:0; padding:24px; align-items:center; justify-content:center; text-align:center; background:#14111c; line-height:1.6; }
    .error.visible { display:flex; }
    body.embed main { padding:0; gap:0; }
    body.embed header, body.embed .hint { display:none; }
    body.embed .video-shell { width:100vw; height:100dvh; max-width:none; aspect-ratio:auto; border-radius:0; box-shadow:none; }
    @media(max-width:620px) { main { gap:12px; } header { flex-wrap:wrap; } .actions { margin-inline-start:auto; } .video-shell { border-radius:9px; } button { padding:9px 11px; font-size:14px; } }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>סרט פתיחה</h1>
      <div class="actions">
        <button id="soundButton" type="button">🔊 הפעל קול</button>
        <button id="fullscreenButton" type="button">⛶ מסך מלא</button>
      </div>
    </header>
    <div class="video-shell" id="videoShell">
      <video id="video" controls autoplay muted playsinline preload="auto" aria-label="סרט פתיחה">
        <source src="https://res.cloudinary.com/gstuiyt9/video/upload/v1792740979/%D7%A1%D7%A8%D7%98_%D7%A4%D7%AA%D7%99%D7%97%D7%94.mp4" type="video/mp4">
        הדפדפן שלך אינו תומך בניגון וידאו.
      </video>
      <div class="error" id="errorMessage" role="status">לא ניתן לטעון את הסרטון. בדקו את החיבור לאינטרנט או פתחו את קישור הסרטון המקורי.</div>
    </div>
    <p class="hint">הסרטון מתחיל אוטומטית ללא קול בהתאם להגבלות הדפדפן. לחצו על ״הפעל קול״ כדי לשמוע.</p>
  </main>
  <script>
    (() => {
      'use strict';
      const video = document.getElementById('video');
      const soundButton = document.getElementById('soundButton');
      const fullscreenButton = document.getElementById('fullscreenButton');
      const videoShell = document.getElementById('videoShell');
      const errorMessage = document.getElementById('errorMessage');

      if (new URLSearchParams(window.location.search).get('embed') === '1') {
        document.body.classList.add('embed');
      }

      const syncSound = () => {
        soundButton.textContent = video.muted ? '🔊 הפעל קול' : '🔇 השתק קול';
      };
      soundButton.addEventListener('click', () => {
        video.muted = !video.muted;
        syncSound();
        if (video.paused) video.play().catch(() => {});
      });
      video.addEventListener('volumechange', syncSound);
      fullscreenButton.addEventListener('click', () => {
        if (document.fullscreenElement) {
          document.exitFullscreen?.();
        } else if (videoShell.requestFullscreen) {
          videoShell.requestFullscreen();
        } else if (video.webkitEnterFullscreen) {
          video.webkitEnterFullscreen();
        }
      });
      video.addEventListener('error', () => errorMessage.classList.add('visible'));
      // נסו ניגון אוטומטי שקט. במקרה של חסימה, המשתמש יכול לנגן באמצעות בקרי הווידאו.
      video.play().catch(() => {});
      syncSound();
    })();
  </script>
</body>
</html>
